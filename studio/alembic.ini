[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# A URL real e injetada em runtime por alembic/env.py a partir de
# STUDIO_DATABASE_URL. O valor abaixo serve apenas de referencia.
sqlalchemy.url = sqlite:///./data/studio.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
